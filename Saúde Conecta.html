<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Saúde Conecta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: moldura de celular centralizada no desktop, tela cheia no celular. Cabeçalho fixo, conteúdo rolável, navegação inferior. */
:root{
  --bg:#EEF4F3; --surface:#FFFFFF; --fg:#0F2529; --muted:#506A6E; --line:#D3E0DE;
  --brand:#0B6E69; --brand-ink:#FFFFFF; --brand-tint:#DDF1EE;
  --blue:#1F4FA3; --blue-tint:#E3EBF8;
  --ok:#17703A; --ok-tint:#DDF3E4; --warn:#8F5200; --warn-tint:#FFEBCB; --bad:#B3261E; --bad-tint:#FBE2DF;
  --font-display:'Lexend',system-ui,sans-serif; --font-body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --stage:#D9E4E2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1618; --surface:#132226; --fg:#E7F2F0; --muted:#9BB3B2; --line:#25393D;
  --brand:#3FC6BA; --brand-ink:#05231F; --brand-tint:#143A39;
  --blue:#8FB2F5; --blue-tint:#192B4D;
  --ok:#6FD494; --ok-tint:#16361F; --warn:#F2B35A; --warn-tint:#40300F; --bad:#FF9D94; --bad-tint:#43201D;
  --stage:#060E10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1618; --surface:#132226; --fg:#E7F2F0; --muted:#9BB3B2; --line:#25393D;
  --brand:#3FC6BA; --brand-ink:#05231F; --brand-tint:#143A39;
  --blue:#8FB2F5; --blue-tint:#192B4D;
  --ok:#6FD494; --ok-tint:#16361F; --warn:#F2B35A; --warn-tint:#40300F; --bad:#FF9D94; --bad-tint:#43201D;
  --stage:#060E10; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
html{font-size:100%}
html[data-size="2"]{font-size:115%}
html[data-size="3"]{font-size:130%}
body{background:var(--stage);color:var(--fg);font-family:var(--font-body);font-size:1rem;line-height:1.45;display:grid;place-items:center}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}

.shell{width:100%;height:100%;max-width:430px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:600px){.shell{height:min(860px,100%);border-radius:36px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,20,20,.28)}}
.pad{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{background:var(--brand);color:var(--brand-ink);padding-block:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;flex:none}
.top h1{font-size:1.15rem}
.top small{display:block;opacity:.9;font-size:.8rem}
.top .grow{flex:1;min-width:0}
.iconbtn{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:12px;min-width:44px;height:44px;font-weight:700;font-family:var(--font-display)}
:root[data-theme="dark"] .iconbtn{background:rgba(0,0,0,.18)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:16px 24px}
.view{display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none}

/* nav */
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-block:6px}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;color:var(--muted);border-radius:12px;min-height:56px}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--brand);font-weight:700}
nav button[aria-current="page"] svg{background:var(--brand-tint);border-radius:10px;padding:2px 10px;width:48px;box-sizing:border-box}

/* blocos */
.hello h2{font-size:1.35rem}
.hello p{color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero{background:var(--blue);color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
:root[data-theme="dark"] .hero{background:#1C3F80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#1C3F80}}
.hero .tag{align-self:flex-start;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}
.hero h3{font-size:1.2rem}
.btn{border:0;border-radius:12px;min-height:48px;padding:0 18px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--brand-tint);color:var(--brand)}
.btn.light{background:#fff;color:#1F4FA3}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:92px}
.quick svg{width:28px;height:28px;color:var(--brand)}
.quick b{font-family:var(--font-display);font-weight:600;font-size:.98rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3{font-size:1.05rem}
.sec span{color:var(--muted);font-size:.85rem}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:40px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start}
.item .main{flex:1;min-width:0}
.item h3{font-size:1rem}
.item p{color:var(--muted);font-size:.9rem;margin-top:2px}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-tint);color:var(--ok)}
.b-warn{background:var(--warn-tint);color:var(--warn)}
.b-bad{background:var(--bad-tint);color:var(--bad)}
.b-info{background:var(--blue-tint);color:var(--blue)}
.date{flex:none;width:52px;border-radius:12px;background:var(--brand-tint);color:var(--brand);text-align:center;padding:6px 0;font-family:var(--font-display);line-height:1.1}
.date b{display:block;font-size:1.25rem}
.date small{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.link{border:0;background:none;color:var(--blue);font-weight:700;padding:6px 0;min-height:40px}
.switch{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;min-height:40px;font-size:.88rem}
.switch[aria-pressed="true"]{background:var(--ok-tint);color:var(--ok);border-color:transparent;font-weight:700}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-weight:700;font-size:.92rem}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:0 12px;width:100%}
.input:focus{border-color:var(--blue)}
.back{border:0;background:none;color:var(--blue);font-weight:700;align-self:flex-start;min-height:40px;padding:0}
.note{font-size:.82rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-line;overflow-wrap:anywhere}
.msg.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px;align-self:flex-end}
.composer{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.composer .input{flex:1;min-width:0}

/* sobre */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--font-display);font-size:1.9rem;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.85rem;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-family:var(--font-display)}
ul.steps{padding:0;margin:0}
.ods{display:flex;gap:10px;flex-wrap:wrap}
.ods div{flex:1 1 130px;border-radius:14px;padding:12px;color:#fff;font-size:.85rem}
.ods b{display:block;font-family:var(--font-display);font-size:1.3rem}
.o3{background:#2E7D32}.o9{background:#B5530B}.o10{background:#B0136B}
.quote{border-left:4px solid var(--brand);padding-left:12px;font-style:italic}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;max-width:90%;text-align:center;z-index:5}
.toast[hidden]{display:none}
.demo{background:var(--warn-tint);color:var(--warn);padding:6px 16px;font-size:.78rem;text-align:center;font-weight:700}

.seg{display:grid;grid-template-columns:1fr 1.5fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;min-height:44px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--brand-tint);color:var(--brand);font-size:.78rem;margin-left:6px}
.prog{display:flex;flex-direction:column;gap:6px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bars i{height:6px;border-radius:99px;background:var(--line)}
.bars i.on{background:var(--brand)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;min-height:64px}
.opt b{font-family:var(--font-display);font-weight:600}
.opt span{color:var(--muted);font-size:.88rem}
.opt .badge{color:var(--ok)}.opt .badge.b-bad{color:var(--bad)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;width:70px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;min-height:78px}
.day small{text-transform:uppercase;font-size:.7rem;letter-spacing:.06em;color:var(--muted)}
.day b{font-family:var(--font-display);font-size:1.3rem;line-height:1.3}
.day span{font-size:.7rem;color:var(--ok);font-weight:700}
.day[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] span{color:inherit}
.day:disabled{opacity:.45;cursor:not-allowed}.day:disabled span{color:var(--bad)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;font-weight:700;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.wnav{position:sticky;bottom:0;display:flex;gap:10px;background:var(--bg);padding-block:12px 4px;margin-top:4px}
.wnav .btn:not(.ghost){flex:1}
.check{display:flex;gap:12px;align-items:flex-start}
.check input{width:24px;height:24px;margin-top:2px;accent-color:var(--brand);flex:none}
dl{margin:0}.sumrow{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);align-items:flex-start}
.sumrow:last-child{border:0}.sumrow>div{min-width:0}.sumrow dt{color:var(--muted);font-size:.85rem}.sumrow dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center}
.ok-ic{width:56px;height:56px;border-radius:50%;background:var(--ok-tint);color:var(--ok);display:grid;place-items:center;font-size:1.8rem;font-weight:700;margin-inline:auto}
.code{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.code b{font-family:var(--font-display);font-size:1.3rem;letter-spacing:.08em}.code span{font-size:.8rem;color:var(--muted)}
.notice{background:var(--blue-tint);color:var(--blue);border-radius:12px;padding:10px 12px;font-size:.9rem}
.ask{background:var(--bad-tint);border-radius:12px;padding:10px 12px;margin-top:10px}
.btn.danger{background:var(--bad-tint);color:var(--bad)}
.dim{opacity:.7}

.bars10{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-block:10px 6px}
.bars10 i{height:8px;border-radius:99px;background:var(--line)}.bars10 i.on{background:var(--brand)}
.qlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;min-height:52px;font-weight:700}
.qbtn:disabled{opacity:.5;cursor:not-allowed}
.speak{display:block;margin-top:8px;border:1.5px solid var(--brand);color:var(--brand);background:transparent;border-radius:99px;min-height:40px;padding:0 16px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.view:not([hidden]){animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>

<div class="shell" id="shell">
  <header class="top pad">
    <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
    <div class="grow"><h1>Saúde Conecta</h1><small>Zona Sul · São Paulo</small></div>
    <button class="iconbtn" id="sizeBtn" aria-label="Alterar tamanho do texto">A+</button>

  <div class="demo">Protótipo de extensão · dados de demonstração</div>
  <main class="pad" id="main"></main>
  <nav id="nav" aria-label="Navegação principal"></nav>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

  var st={view:'home',filter:'Todos',lembrar:{c1:true},q:'',agend:load(),btab:'novo',cancelAsk:null,book:newBook(),
          faixa:null,usadas:0,feitas:{},chat:[],size:1};
  try{var sv=localStorage.getItem('sc-size');if(sv)st.size=+sv}catch(e){}

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  var DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
  function proximosDias(){var r=[],d=new Date();while(r.length<8){d=new Date(d.getTime()+864e5);if(d.getDay()>0&&d.getDay()<6)r.push(iso(d))}return r}
  function fmt(d){return DIAS[d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fromIso(x){var p=x.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function fmtIso(x){return fmt(fromIso(x))}
  function load(){try{var v=JSON.parse(localStorage.getItem('sc-agend')||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}}
  function save(){try{localStorage.setItem('sc-agend',JSON.stringify(st.agend))}catch(e){}}
  function newBook(p){p=p||{};return{step:1,serv:null,unid:null,dia:null,hora:null,nome:p.nome||'',tel:p.tel||'',sus:p.sus||'',prio:false,replacing:null,done:null}}
  function ocupado(u,x,h){
    var d=fromIso(x),k=(d.getDate()*7+d.getMonth()*3+u*5+h*11)%10;
    if(k<3)return true;
    return st.agend.some(function(a){return a.status==='ativo'&&a.cod!==st.book.replacing&&a.iso===x&&a.hora===HORAS[h]});
  }
  function vagas(u,x){var n=0;HORAS.forEach(function(_,h){if(!ocupado(u,x,h))n++});return n}
  function proxVaga(u){var ds=proximosDias();for(var i=0;i<ds.length;i++)for(var h=0;h<HORAS.length;h++)if(!ocupado(u,ds[i],h))return{iso:ds[i],hora:HORAS[h]};return null}
  function maskTel(d){if(d.length<3)return d;var c=d.length>10?7:6,r='('+d.slice(0,2)+') '+d.slice(2,c);if(d.length>c)r+='-'+d.slice(c);return r}
  function maskSus(d){return d.replace(/(\d{3})(?=\d)/g,'$1 ').trim()}
  function telOk(b){return b.tel.length===10||b.tel.length===11}
  function formOk(){var b=st.book,n=b.nome.trim();return n.length>=5&&/\s/.test(n)&&telOk(b)&&(b.sus===''||b.sus.length===15)}
  function refreshForm(){var b=st.book,n=$('#next');if(n)n.disabled=!formOk();var et=$('#e-tel');if(et)et.hidden=!(b.tel.length>0&&!telOk(b));var es=$('#e-sus');if(es)es.hidden=!(b.sus.length>0&&b.sus.length!==15)}
  function ativos(){return st.agend.filter(function(a){return a.status==='ativo'}).sort(function(a,b){return (a.iso+a.hora)<(b.iso+b.hora)?-1:1})}
  function hoje(){var h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}

  function renderNav(){
    $('#nav').innerHTML=NAV.map(function(n){return '<button data-go="'+n[0]+'"'+(st.view===n[0]?' aria-current="page"':'')+'>'+I[n[0]]+'<span>'+n[1]+'</span></button>'}).join('');
  }

  /* ---------- telas ---------- */
  function campCard(c){
    return '<article class="card item"><div class="date"><b>'+c.d+'</b><small>'+c.m+'</small></div><div class="main"><span class="badge '+(c.tipo==='Vacina'?'b-ok':'b-info')+'">'+c.tipo+'</span>'+
      '<h3 style="margin-top:6px">'+esc(c.titulo)+'</h3><p>'+esc(c.txt)+'</p><p><b>Para:</b> '+esc(c.pub)+'</p>'+
      '<div class="row"><button class="switch" data-lembrar="'+c.id+'" aria-pressed="'+(!!st.lembrar[c.id])+'">'+(st.lembrar[c.id]?'✓ Lembrete ativo':'Quero ser lembrado')+'</button></div></div></article>';
  }
  function vHome(){
    var p=ativos()[0],ag=p?'<article class="card item"><div class="date"><b>'+fromIso(p.iso).getDate()+'</b><small>'+['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'][fromIso(p.iso).getMonth()]+'</small></div><div class="main"><span class="badge b-ok">Confirmado</span><h3 style="margin-top:6px">'+esc(p.serv)+'</h3><p>'+esc(UNID[p.unid])+' · '+fmtIso(p.iso)+' às '+p.hora+'</p><p class="note">Protocolo '+p.cod+'</p></div></article>':'';
    return '<section class="view" data-v="home"><div class="hello"><h2>'+hoje()+(st.book.nome?', '+esc(st.book.nome.split(' ')[0]):'')+'!</h2><p>O que você precisa hoje?</p></div>'+
      '<div class="hero"><span class="tag">Próxima campanha</span><h3>'+CAMPS[0].titulo+'</h3><p>'+CAMPS[0].txt+'</p><button class="btn light" data-go="vac">Ver todas as campanhas</button></div>'+
      '<div class="grid4"><button class="quick" data-go="vac">'+I.vac+'<b>Vacinas e avisos</b></button><button class="quick" data-go="med">'+I.med+'<b>Tem remédio?</b></button>'+
      '<button class="quick" data-go="book">'+I.cal+'<b>Agendar</b></button><button class="quick" data-go="bot">'+I.bot+'<b>Falar com o assistente</b></button></div>'+
      (ag?'<div class="sec"><h3>Próximo agendamento</h3><button class="link" data-btab="meus">Ver todos</button></div>'+ag:'')+
      '<div class="sec"><h3>Avisos da semana</h3><button class="link" data-go="vac">Ver todos</button></div><div class="list">'+campCard(CAMPS[4])+campCard(CAMPS[1])+'</div></section>';
  }
  function vVac(){
    var f=['Todos','Vacina','Aviso'];
    var l=CAMPS.filter(function(c){return st.filter==='Todos'||c.tipo===st.filter});
    return '<section class="view" data-v="vac"><div class="hello"><h2>Vacinas e avisos</h2><p>Campanhas das unidades de saúde da região.</p></div>'+
      '<div class="chips" role="group" aria-label="Filtrar">'+f.map(function(x){return '<button class="chip" data-filter="'+x+'" aria-pressed="'+(st.filter===x)+'">'+x+(x==='Todos'?'':'s')+'</button>'}).join('')+'</div>'+
      '<div class="list">'+l.map(campCard).join('')+'</div></section>';

  function badge(s){return s==='ok'?'<span class="badge b-ok">Disponível</span>':s==='pouco'?'<span class="badge b-warn">Pouco estoque</span>':'<span class="badge b-bad">Em falta</span>'}

    return l.map(function(m){return '<article class="card"><h3>'+m[0]+'</h3><div class="list" style="margin-top:8px;gap:6px">'+UNID.map(function(u,i){return '<div class="item" style="align-items:center;justify-content:space-between"><span style="flex:1;min-width:0">'+u+'</span>'+badge(m[1][i])+'</div>'}).join('')+'</div></article>'}).join('');
  }
  function vMed(){
    return '<section class="view" data-v="med"><div class="hello"><h2>Tem remédio na unidade?</h2><p>Veja antes de sair de casa.</p></div>'+
      '<div class="field"><label for="q">Buscar medicamento</label><input class="input" id="q" type="search" placeholder="Ex.: dipirona" value="'+esc(st.q)+'" autocomplete="off"></div>'+
      '<div class="list" id="medlist">'+medList()+'</div><p class="note">Estoques fictícios para demonstração. Confirme na unidade antes de ir.</p></section>';
  }
  function vBook(){
    var b=st.book,n=ativos().length;
    var tabs='<div class="seg" role="tablist"><button role="tab" data-btab="novo" aria-selected="'+(st.btab==='novo')+'">Novo</button><button role="tab" data-btab="meus" aria-selected="'+(st.btab==='meus')+'">Meus agendamentos'+(n?'<span class="count">'+n+'</span>':'')+'</button></div>';
    return '<section class="view" data-v="book"><button class="back" data-go="home">← Voltar</button><div class="hello"><h2>Agendamentos</h2><p>Marque sem sair de casa. Simulação para demonstração.</p></div>'+tabs+(st.btab==='meus'?bMeus():(b.done?bOk():bWizard()))+'</section>';
  }
  function bWizard(){
    var b=st.book,s=b.step,h='';
    h+='<div class="prog"><div class="bars">'+PASSOS.map(function(p,i){return '<i class="'+(i<s?'on':'')+'"></i>'}).join('')+'</div><p class="note">Passo '+s+' de 5 · <b>'+PASSOS[s-1]+'</b></p></div>';
    if(b.replacing)h+='<div class="notice">Remarcando o protocolo '+b.replacing+'. O horário antigo é liberado quando você confirmar.</div>';
    if(s===1)h+='<div class="list">'+SERV.map(function(x,i){return '<button class="opt" data-serv="'+i+'" aria-pressed="'+(b.serv===i)+'"><b>'+x.n+'</b><span>'+x.dur+' · '+x.un.length+(x.un.length>1?' unidades':' unidade')+'</span></button>'}).join('')+'</div>';
    if(s===2)h+='<div class="list">'+SERV[b.serv].un.map(function(u){var p=proxVaga(u),i=UINFO[u];return '<button class="opt" data-unid="'+u+'" aria-pressed="'+(b.unid===u)+'"><b>'+UNID[u]+'</b><span>'+i.end+' · a '+i.dist+'</span><span>'+i.hor+'</span>'+(p?'<span class="badge b-ok">Próxima vaga: '+fmtIso(p.iso)+' às '+p.hora+'</span>':'<span class="badge b-bad">Sem vagas nos próximos dias</span>')+'</button>'}).join('')+'</div>';
    if(s===3){
      h+='<div class="field"><span class="label">Dia</span><div class="days">'+proximosDias().map(function(d){var n=vagas(b.unid,d),w=fromIso(d);return '<button class="day" data-dia="'+d+'" aria-pressed="'+(b.dia===d)+'"'+(n?'':' disabled')+'><small>'+DIAS[w.getDay()]+'</small><b>'+w.getDate()+'</b><span>'+(n?n+(n>1?' vagas':' vaga'):'lotado')+'</span></button>'}).join('')+'</div></div>';
      if(!b.dia)h+='<p class="note">Escolha um dia para ver os horários livres.</p>';
      else{
        var grp=function(t,a,z){return '<div class="field"><span class="label">'+t+'</span><div class="slots">'+HORAS.map(function(x,i){return i>=a&&i<z?'<button class="slot" data-hora="'+i+'" aria-pressed="'+(b.hora===i)+'"'+(ocupado(b.unid,b.dia,i)?' disabled':'')+'>'+x+'</button>':''}).join('')+'</div></div>'};
        h+=grp('Manhã',0,5)+grp('Tarde',5,9)+'<p class="note">Horários riscados já estão ocupados ou coincidem com outro agendamento seu.</p>';
      }
    }
    if(s===4)h+='<div class="field"><label for="nome">Nome completo</label><input class="input" id="nome" value="'+esc(b.nome)+'" autocomplete="off" placeholder="Nome e sobrenome"></div>'+
      '<div class="field"><label for="tel">Telefone com DDD</label><input class="input" id="tel" inputmode="tel" value="'+maskTel(b.tel)+'" autocomplete="off" placeholder="(11) 91234-5678"><p class="note" style="color:var(--bad)" id="e-tel" hidden>Digite o DDD e o número completo.</p></div>'+
      '<div class="field"><label for="sus">Cartão SUS <span class="note">(opcional)</span></label><input class="input" id="sus" inputmode="numeric" value="'+maskSus(b.sus)+'" autocomplete="off" placeholder="15 números"><p class="note" style="color:var(--bad)" id="e-sus" hidden>O Cartão SUS tem 15 números.</p></div>'+
      '<label class="check"><input type="checkbox" id="prio"'+(b.prio?' checked':'')+'><span>Tenho prioridade legal (idoso, gestante, pessoa com deficiência)</span></label>';
    if(s===5){
      var row=function(l,v,st2){return '<div class="sumrow"><div><dt>'+l+'</dt><dd>'+v+'</dd></div><button class="link" data-step="'+st2+'">Alterar</button></div>'};
      h+='<dl class="card">'+row('Serviço',esc(SERV[b.serv].n),1)+row('Unidade',esc(UNID[b.unid])+'<br><span class="note">'+UINFO[b.unid].end+'</span>',2)+row('Data e horário',fmtIso(b.dia)+' às '+HORAS[b.hora],3)+row('Paciente',esc(b.nome)+'<br><span class="note">'+maskTel(b.tel)+'</span>',4)+row('Cartão SUS',b.sus?maskSus(b.sus):'Não informado',4)+row('Prioridade',b.prio?'Sim':'Não',4)+'</dl>'+
        '<div class="card"><p class="label">Leve no dia</p><ul style="margin:6px 0 0;padding-left:20px">'+SERV[b.serv].lev.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
    }
    var ok=s===1?b.serv!==null:s===2?b.unid!==null:s===3?b.hora!==null:s===4?formOk():true;
    h+='<div class="wnav"><button class="btn ghost" data-prev>Voltar</button>'+(s<5?'<button class="btn" id="next" data-next'+(ok?'':' disabled')+'>Continuar</button>':'<button class="btn" id="confirma">Confirmar agendamento</button>')+'</div>';
    return h;
  }
  function bOk(){
    var a=st.book.done;
    return '<div class="ticket"><div class="ok-ic" aria-hidden="true">✓</div><h3>Agendamento confirmado</h3><p class="note">Simulação para demonstração. Nada foi enviado a uma unidade real.</p>'+
      '<dl style="text-align:left"><div class="sumrow"><div><dt>Serviço</dt><dd>'+esc(a.serv)+'</dd></div></div><div class="sumrow"><div><dt>Unidade</dt><dd>'+esc(UNID[a.unid])+'<br><span class="note">'+UINFO[a.unid].end+'</span></dd></div></div><div class="sumrow"><div><dt>Data e horário</dt><dd>'+fmtIso(a.iso)+' às '+a.hora+'</dd></div></div></dl>'+

  function count(){
    document.querySelectorAll('[data-n]').forEach(function(e){
      var n=+e.dataset.n,s=e.dataset.s||'',i=0;
      if(matchMedia('(prefers-reduced-motion:reduce)').matches){e.textContent=n+s;return}

    });

    crianca:{n:'Criança · 0 a 11 anos',d:'Conversa com o pai, a mãe ou o responsável',hi:'Olá! Vou responder para você, responsável. Escolha uma dúvida na lista abaixo ou escreva a sua. São 10 perguntas por conversa.'},
    adolescente:{n:'Adolescente · 12 a 17 anos',d:'Linguagem direta, com temas da idade',hi:'Oi! Pode perguntar o que quiser sobre saúde. Escolha uma dúvida abaixo ou escreva a sua. São 10 perguntas por conversa.'},
    adulto:{n:'Adulto · 18 a 59 anos',d:'Vacinas, exames, remédios e agendamento',hi:'Olá! Escolha uma dúvida na lista abaixo ou escreva a sua. São 10 perguntas por conversa.'},
    idoso:{n:'Pessoa idosa · 60 anos ou mais',d:'Frases curtas e respostas que podem ser ouvidas',hi:'Olá! Toque em uma dúvida da lista. Em cada resposta, o botão “Ouvir” lê o texto em voz alta. São 10 perguntas por conversa.'}
  };
  function gt(x,f){return typeof x==='string'?x:x[f]}
  var AVISO='\n\nInformação geral. Não substitui consulta. Em emergência, ligue 192 (SAMU).';
  var QS=[
    {k:/vacin|caderneta|imuniz|dose/,
     l:{crianca:'Quais vacinas meu filho precisa?',adolescente:'Quais vacinas eu preciso tomar?',adulto:'Quais vacinas devo tomar?',idoso:'Quais vacinas são para idosos?'},
     r:{crianca:'Nos primeiros anos o calendário do SUS inclui, entre outras: BCG e hepatite B, pentavalente, VIP (pólio), rotavírus, pneumocócica, meningocócica C, febre amarela, tríplice viral e varicela. A partir dos 9 anos entra o HPV. Leve a caderneta: a equipe confere o que está em dia. O calendário muda, então confirme na unidade.',
        adolescente:'Entre 9 e 14 anos: HPV. Aos 11 a 14 anos: meningocócica ACWY. Também vale conferir hepatite B, febre amarela, tríplice viral e o reforço do dT. Leve a caderneta e a equipe diz o que falta.',
        adulto:'Em geral: dT (difteria e tétano) com reforço a cada 10 anos, hepatite B, febre amarela e tríplice viral (até 59 anos) se não tomou antes. Gestantes têm esquema próprio. Gripe e covid seguem as campanhas. A caderneta mostra o que está em dia.',
        idoso:'A partir dos 60 anos: gripe todo ano, covid conforme o calendário do momento e reforço do dT a cada 10 anos. Pneumocócica e hepatite B são indicadas em alguns casos. Leve a caderneta ou mostre o Meu SUS Digital na unidade.'}},
    {k:/campanha|dia d\b|gripe|hpv|abert/,
     l:'Quais campanhas estão abertas?',
     r:{crianca:'Para crianças agora:\n• Dia D de multivacinação: sábado 14/11, das 8h às 17h\n• Gripe: até 20/11\nA aba “Vacinas” mostra detalhes e permite ativar lembretes.',
        adolescente:'Para a sua idade agora:\n• Dia D de multivacinação: sábado 14/11, das 8h às 17h\n• HPV (9 a 14 anos): até 30/11',
        adulto:'Agora:\n• Gripe: até 20/11 (grupos prioritários)\n• Novembro Azul, a partir de 50 anos: exames até 25/11, com hora marcada\n• Dia D de multivacinação: sábado 14/11',
        idoso:'Para você agora:\n• Vacina da gripe: até 20/11, de segunda a sexta\n• Novembro Azul (homens 50+): exames até 25/11, com hora marcada\n• Grupo de hipertensos e diabéticos: 12/11, às 14h'}},
    {k:/agend|consulta|marcar/,
     l:{crianca:'Como marcar consulta para meu filho?',adolescente:'Como marcar uma consulta?',adulto:'Como agendo uma consulta?',idoso:'Como marco uma consulta?'},
     r:{crianca:'Na tela inicial, toque em “Agendar”. Escolha o serviço, a unidade, o dia e o horário e informe os dados da criança e o seu telefone. Leve a caderneta e o documento do responsável.',
        adolescente:'Toque em “Agendar” na tela inicial e siga os 5 passos. Menores de 18 anos devem ir acompanhados de um responsável.',
        adulto:'Toque em “Agendar” na tela inicial, escolha serviço, unidade, dia e horário. Leva cerca de 2 minutos e você recebe um protocolo.',
        idoso:'Toque em “Agendar” na tela inicial e siga os passos. Se preferir, vá à unidade e peça ajuda na recepção. Pessoas com 60 anos ou mais têm prioridade no atendimento.'}},
    {k:/rem[eé]dio|medicament|receita|farm[aá]cia/,
     l:{crianca:'Como pegar remédio para meu filho?',adolescente:'Como retiro um medicamento?',adulto:'Como sei se tem o remédio?',idoso:'Como pego meus remédios do mês?'},
     r:{crianca:'Abra a aba “Remédios” e busque o nome para ver a disponibilidade. Para retirar, leve a receita do pediatra e o documento do responsável. Não dê remédio à criança sem orientação: a dose depende do peso.',
        adolescente:'Veja a disponibilidade na aba “Remédios”. Para retirar, leve a receita e o documento com foto. Use só o que foi receitado.',
        adulto:'Abra a aba “Remédios”, digite o nome e veja se há estoque nas 3 unidades. Para retirar, leve receita atual e documento com foto.',
        idoso:'Na aba “Remédios”, digite o nome para ver se há estoque. Para uso contínuo (pressão, diabetes), leve a receita atual e o documento. Peça à equipe para organizar a retirada e use um porta-comprimidos semanal.'}},
    {k:/sus digital|aplicativo|\bapp\b|gov\.?br|celular/,
     l:'Como usar o Meu SUS Digital?',
     r:{crianca:'O Meu SUS Digital mostra a caderneta de vacinação e atendimentos. Para a criança, leve o CPF ou Cartão SUS dela à unidade e peça ajuda para conferir o cadastro.',
        adolescente:'Passo a passo:\n1. Baixe o app “Meu SUS Digital”.\n2. Entre com a conta gov.br.\n3. Toque em “Vacinas” para ver a caderneta.',
        adulto:'Passo a passo:\n1. Baixe o app “Meu SUS Digital”.\n2. Entre com a conta gov.br.\n3. Veja vacinas, exames e atendimentos.\nA oficina do projeto distribuiu um guia rápido impresso.',
        idoso:'Peça ajuda a um familiar ou à equipe da unidade.\n1. Baixe o app “Meu SUS Digital”.\n2. Entre com a conta gov.br.\n3. Toque em “Vacinas”.\nA oficina do projeto tem guia impresso com letras grandes.'}},
    {k:/urg[eê]ncia|emerg|febre|\bdor\b|socorro|sinais|samu|alerta|falta de ar|desmai/,
     l:{crianca:'Quando levar meu filho à urgência?',adolescente:'Quando devo procurar urgência?',adulto:'Quais sinais pedem urgência?',idoso:'Quais sinais pedem urgência?'},
     r:{crianca:'Procure urgência ou ligue 192 se a criança tiver: dificuldade para respirar, convulsão, sonolência excessiva, vômitos repetidos com recusa de líquidos, febre em bebê com menos de 3 meses, ou sinais de desidratação (boca seca, sem urinar há muitas horas).'+AVISO,
        adolescente:'Ligue 192 ou vá à urgência se tiver: falta de ar, dor forte no peito, desmaio, convulsão, sangramento que não para, pensamentos de se machucar ou reação alérgica forte.'+AVISO,
        adulto:'Ligue 192 ou vá à urgência se tiver: dor no peito, falta de ar, fraqueza de um lado do corpo, fala enrolada, desmaio, sangramento intenso ou febre alta com confusão.'+AVISO,
        idoso:'Ligue 192 ou vá à urgência se tiver: dor no peito, falta de ar, confusão repentina, fraqueza de um lado do corpo, fala enrolada, queda com pancada na cabeça ou desmaio.'+AVISO}},
    {k:/document|\brg\b|cpf|cart[aã]o|levar/,
     l:'Quais documentos levar?',
     r:{crianca:'Leve: certidão de nascimento ou documento da criança, documento com foto do responsável, Cartão SUS (a unidade pode emitir) e a caderneta de vacinação.',
        adolescente:'Leve: documento com foto, Cartão SUS ou CPF, caderneta de vacinação e um responsável se tiver menos de 18 anos.',
        adulto:'Leve: documento com foto, Cartão SUS ou CPF, comprovante de residência e, conforme o caso, caderneta de vacinação ou receita. Sem Cartão SUS, a unidade pode emitir.',
        idoso:'Leve: documento com foto, Cartão SUS, comprovante de residência, receitas e exames anteriores. Se tiver caderneta de vacinação, leve também.'}},
    {k:/endere[cç]o|onde fica|hor[aá]rio|funciona|unidade|abre|fecha|perto/,
     l:'Onde ficam as unidades e qual o horário?',
     r:UINFO_TXT()},
    {k:/aliment|exerc[ií]cio|h[aá]bito|dieta|\bpeso\b|\bsono\b|atividade|saud[aá]vel|comer/,
     l:{crianca:'Como cuidar da alimentação e do sono?',adolescente:'Como cuidar do corpo e do sono?',adulto:'Quais hábitos ajudam a prevenir doenças?',idoso:'Como me manter ativo e saudável?'},
     r:{crianca:'Ofereça frutas, verduras e água; reduza doces e refrigerante. Mantenha horário de sono, limite telas e estimule brincar ao ar livre. Escovar os dentes depois das refeições.',
        adolescente:'Durma de 8 a 10 horas, mexa o corpo todo dia, beba água e evite refrigerante em excesso. Álcool, cigarro e vape fazem mal: converse na unidade sem julgamento.',
        adulto:'Faça ao menos 150 minutos de atividade física por semana, coma mais comida de verdade e menos ultraprocessados e meça pressão e glicemia periodicamente. Pergunte na unidade sobre exames preventivos para a sua idade.',
        idoso:'Caminhadas leves e alongamento ajudam o equilíbrio. Beba água ao longo do dia, deixe a casa bem iluminada e sem tapetes soltos para evitar quedas e mantenha pressão e glicemia em dia.'}},
    {k:/ansied|triste|depress|emocion|mental|psic|estresse|cvv|sozinh|solid/,
     l:{crianca:'Meu filho está agitado ou com medo. O que fazer?',adolescente:'Estou ansioso ou triste. Onde busco ajuda?',adulto:'Onde buscar apoio emocional?',idoso:'Estou me sentindo sozinho ou triste. O que fazer?'},
     r:{crianca:'Mudanças de humor, medo intenso, pesadelos ou queda na escola merecem atenção. Escute a criança, mantenha rotina e converse com o pediatra ou a equipe da unidade. A escola também pode ajudar.',
        adolescente:'Sentir ansiedade ou tristeza é comum, mas você não precisa passar por isso sozinho. Fale com alguém de confiança e procure a unidade de saúde. O CVV atende pelo telefone 188, 24 horas, gratuito.',
        adulto:'A unidade de saúde acolhe quem está com ansiedade, tristeza ou estresse e pode encaminhar para o CAPS quando precisar. O CVV atende pelo telefone 188, 24 horas, gratuito.',
        idoso:'Solidão e tristeza são comuns e têm cuidado. Converse com a equipe da unidade, procure grupos de convivência e fale com familiares. O CVV atende pelo telefone 188, 24 horas, gratuito.'}}
  ];
  function UINFO_TXT(){return UNID.map(function(u,i){return '• '+u+'\n  '+UINFO[i].end+' (a '+UINFO[i].dist+')\n  '+UINFO[i].hor}).join('\n')}
  var PRIO=[1,0,3,2,4,5,6,7,8,9];
  function match(t){for(var i=0;i<PRIO.length;i++)if(QS[PRIO[i]].k.test(t))return PRIO[i];return -1}
  function answer(i){
    st.usadas++;st.feitas[i]=1;st.chat.push({w:'bot',t:gt(QS[i].r,st.faixa)});
    if(st.usadas>=10)st.chat.push({w:'bot',t:'Você usou as 10 perguntas desta conversa. Para continuar, toque em “Recomeçar conversa”. Se precisar de mais ajuda, procure a unidade de saúde ou ligue para o Disque Saúde 136.'});
  }
  function askQ(i){if(!st.faixa||st.usadas>=10)return;st.chat.push({w:'me',t:gt(QS[i].l,st.faixa)});answer(i);render()}
  function askFree(t){
    t=t.trim();if(!t||!st.faixa||st.usadas>=10)return;
    st.chat.push({w:'me',t:t});var low=t.toLowerCase();
    var med=MEDS.filter(function(m){return low.indexOf(m[0].split(' ')[0].toLowerCase())>-1})[0];
    if(med){st.usadas++;st.feitas[3]=1;st.chat.push({w:'bot',t:med[0]+':\n'+UNID.map(function(u,i){return '• '+u+': '+({ok:'disponível',pouco:'pouco estoque',falta:'em falta'})[med[1][i]]}).join('\n')+'\n(Dados de demonstração.)'});if(st.usadas>=10)answer.fim();render();return}
    var i=match(low);
    if(i>=0)answer(i);
    else if(/^(oi|ol[aá]|bom dia|boa tarde|boa noite)\b/.test(low))st.chat.push({w:'bot',t:'Olá! Escolha uma dúvida da lista ou escreva a sua. Esta mensagem não conta nas 10 perguntas.'});
    else if(/obrigad|valeu/.test(low))st.chat.push({w:'bot',t:'De nada! Estou aqui se precisar.'});
    else st.chat.push({w:'bot',t:'Não entendi essa pergunta. Tente falar de vacinas, remédios, consulta, documentos, endereços ou escolha uma da lista. Esta mensagem não conta nas 10 perguntas.'});
    render();
  }
  answer.fim=function(){st.chat.push({w:'bot',t:'Você usou as 10 perguntas desta conversa. Para continuar, toque em “Recomeçar conversa”. Se precisar de mais ajuda, procure a unidade de saúde ou ligue para o Disque Saúde 136.'})};

  /* ---------- eventos ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.go){if(b.dataset.go==='book'){st.btab='novo';if(st.book.done)st.book=newBook(st.book)}st.view=b.dataset.go;render();return}
    if(b.dataset.filter){st.filter=b.dataset.filter;render(true);return}
    if(b.dataset.lembrar){var id=b.dataset.lembrar;st.lembrar[id]=!st.lembrar[id];toast(st.lembrar[id]?'Lembrete ativado':'Lembrete removido');render(true);return}
    var k=st.book;
    if(b.dataset.btab){st.view='book';st.btab=b.dataset.btab;st.cancelAsk=null;render();return}
    if(b.dataset.serv!==undefined){var v=+b.dataset.serv;if(k.serv!==v){k.serv=v;if(SERV[v].un.indexOf(k.unid)<0)k.unid=null;k.dia=null;k.hora=null}render(true);return}
    if(b.dataset.unid!==undefined){var u=+b.dataset.unid;if(k.unid!==u){k.unid=u;k.hora=null;k.dia=null}render(true);return}
    if(b.dataset.dia){k.dia=b.dataset.dia;k.hora=null;render(true);return}
    if(b.dataset.hora!==undefined){k.hora=+b.dataset.hora;render(true);return}
    if(b.hasAttribute('data-next')&&!b.disabled){k.step++;render();return}
    if(b.hasAttribute('data-prev')){if(k.step===1){st.view='home'}else k.step--;render();return}
    if(b.dataset.step){k.step=+b.dataset.step;render();return}
    if(b.hasAttribute('data-new')){st.book=newBook(k);st.btab='novo';render();return}
    if(b.dataset.copy){var c=b.dataset.copy;try{navigator.clipboard.writeText(c).then(function(){toast('Protocolo copiado')},function(){toast('Anote o protocolo: '+c)})}catch(x){toast('Anote o protocolo: '+c)}return}
    if(b.dataset.cancel){st.cancelAsk=b.dataset.cancel;render(true);return}
    if(b.hasAttribute('data-cancel-no')){st.cancelAsk=null;render(true);return}
    if(b.dataset.cancelYes){st.agend.forEach(function(a){if(a.cod===b.dataset.cancelYes)a.status='cancelado'});st.cancelAsk=null;save();toast('Agendamento cancelado');render(true);return}
    if(b.dataset.resched){var o=st.agend.filter(function(a){return a.cod===b.dataset.resched})[0];if(o){st.book=newBook(o);st.book.serv=o.sv;st.book.unid=o.unid;st.book.step=3;st.book.replacing=o.cod;st.book.prio=!!o.prio;st.btab='novo';render()}return}
    if(b.dataset.faixa){st.faixa=b.dataset.faixa;st.usadas=0;st.feitas={};st.chat=[{w:'bot',t:FAIXAS[st.faixa].hi}];render();return}
    if(b.hasAttribute('data-restart')){st.faixa=null;st.usadas=0;st.feitas={};st.chat=[];try{speechSynthesis.cancel()}catch(x){}render();return}
    if(b.dataset.q!==undefined){askQ(+b.dataset.q);return}
    if(b.dataset.speak!==undefined){try{speechSynthesis.cancel();var ut=new SpeechSynthesisUtterance(st.chat[+b.dataset.speak].t);ut.lang='pt-BR';ut.rate=st.faixa==='idoso'?0.85:1;speechSynthesis.speak(ut)}catch(x){toast('Áudio indisponível neste aparelho')}return}
    if(b.id==='confirma'){
      if(ocupado(k.unid,k.dia,k.hora)){toast('Esse horário acabou de ser ocupado. Escolha outro.');k.step=3;k.hora=null;render();return}
      var cod='SC-'+Math.random().toString(36).slice(2,7).toUpperCase();
      if(k.replacing)st.agend.forEach(function(a){if(a.cod===k.replacing)a.status='remarcado'});
      var n={cod:cod,sv:k.serv,serv:SERV[k.serv].n,unid:k.unid,iso:k.dia,hora:HORAS[k.hora],nome:k.nome.trim(),tel:k.tel,sus:k.sus,prio:k.prio,status:'ativo'};
      st.agend.unshift(n);save();k.done=n;k.replacing=null;render();toast('Agendamento confirmado');return}
    if(b.id==='sizeBtn'){st.size=st.size%3+1;document.documentElement.setAttribute('data-size',st.size);try{localStorage.setItem('sc-size',st.size)}catch(x){}toast('Tamanho do texto: '+['normal','grande','muito grande'][st.size-1]);return}
    if(b.id==='themeBtn'){var r=document.documentElement,dk=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',dk?'light':'dark');return}
  });
  document.addEventListener('input',function(e){
    var t=e.target,b=st.book;
    if(t.id==='q'){st.q=t.value;$('#medlist').innerHTML=medList();return}
    if(t.id==='nome'){b.nome=t.value}
    else if(t.id==='tel'){b.tel=t.value.replace(/\D/g,'').slice(0,11);t.value=maskTel(b.tel)}
    else if(t.id==='sus'){b.sus=t.value.replace(/\D/g,'').slice(0,15);t.value=maskSus(b.sus)}
    else return;
    refreshForm();
  });
  document.addEventListener('change',function(e){if(e.target.id==='prio')st.book.prio=e.target.checked});
  document.addEventListener('submit',function(e){
    e.preventDefault();var i=$('#msg');if(!i)return;askFree(i.value);
  });

  render();
})();
</script>
